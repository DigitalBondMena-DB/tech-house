@if(contactUsData()?.whatsapp_number){
<a [href]="getWhatsAppUrl(contactUsData()?.whatsapp_number)" target="_blank" rel="noopener noreferrer nofollow"
    title="Contact us on WhatsApp"
    class="fixed bottom-4 right-4 w-16 h-16 rounded-full overflow-hidden transition-transform duration-300 z-50 bg-[#08c261] flex items-center justify-center group">
    <img src="/images/icons/whatsapp.svg" loading="lazy" decoding="async" alt="Contact us on WhatsApp"
        class="w-full h-full object-contain p-2 group-hover:scale-110 transition-transform duration-300">
</a>
}
